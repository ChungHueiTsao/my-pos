<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業雲端 POS 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        .modal-bg { background-color: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
        .login-card { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">
    <div id="app" v-cloak class="min-h-screen flex flex-col">
        
        <nav v-if="isLoggedIn" class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
                <div class="font-bold text-xl flex items-center">🏪 {{ storeName }}</div>
                <div class="hidden md:flex space-x-8 font-medium">
                    <button @click="view = 'pos'" :class="view === 'pos' ? 'text-yellow-300' : ''" class="hover:opacity-80">結帳</button>
                    <button @click="view = 'inventory'" :class="view === 'inventory' ? 'text-yellow-300' : ''" class="hover:opacity-80">庫存</button>
                    <button @click="view = 'category'" :class="view === 'category' ? 'text-yellow-300' : ''" class="hover:opacity-80">分類</button>
                    <button @click="view = 'member'" :class="view === 'member' ? 'text-yellow-300' : ''" class="hover:opacity-80">會員</button>
                </div>
                <button @click="logout" class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-lg text-sm transition font-bold">登出</button>
            </div>
        </nav>

        <div v-if="!isLoggedIn" class="flex-grow flex items-center justify-center p-6 bg-gradient-to-br from-indigo-50 to-slate-100">
            <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md login-card border-t-8 border-indigo-700">
                <h2 class="text-3xl font-black text-center text-indigo-900 mb-8 tracking-tight">系統登入</h2>
                <div class="space-y-5">
                    <input v-model="login.user" @keyup.enter="handleLogin" type="text" placeholder="帳號" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white">
                    <input v-model="login.pass" @keyup.enter="handleLogin" type="password" placeholder="密碼" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition bg-slate-50 focus:bg-white">
                    <button @click="handleLogin" :disabled="loading" class="w-full bg-indigo-700 text-white p-4 rounded-2xl font-bold text-lg hover:bg-indigo-800 transition disabled:opacity-50 shadow-indigo-200 shadow-xl flex items-center justify-center">
                        <svg v-if="loading" class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        {{ loading ? '載入中...' : '確認登入' }}
                    </button>
                </div>
            </div>
        </div>

        <main v-else class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full">
            
            <div v-if="view !== 'pos'" class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h1 class="text-2xl font-black text-slate-800">{{ viewName }}管理</h1>
                <div class="flex gap-4">
                    <input v-model="searchQuery" type="text" placeholder="快速搜尋..." class="p-3 border rounded-xl w-64 shadow-sm outline-none focus:ring-2 focus:ring-indigo-400">
                    <button @click="openModal" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition active:scale-95">新增資料</button>
                </div>
            </div>

            <div v-if="view === 'pos'" class="flex flex-col lg:flex-row gap-8">
                <div class="flex-grow grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto max-h-[78vh]">
                    <div v-for="item in filteredData" :key="item.商品編號" @click="addToCart(item)" class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-xl cursor-pointer transition border border-slate-100 group active:scale-95">
                        <div class="text-[10px] font-bold text-indigo-500 mb-1">SN: {{ item.商品編號 }}</div>
                        <div class="font-bold text-slate-800 truncate group-hover:text-indigo-600 mb-2">{{ item.名稱 }}</div>
                        <div class="text-xl font-black text-indigo-700">${{ item.售價 }}</div>
                    </div>
                </div>
                <div class="w-full lg:w-96 bg-white p-6 rounded-3xl shadow-xl h-fit border border-slate-100 sticky top-24">
                    <h3 class="text-xl font-black mb-5 pb-3 border-b flex justify-between"><span>購物清單</span><span class="text-slate-400 text-sm font-normal">({{ cart.length }} 項目)</span></h3>
                    <div class="space-y-4 max-h-64 overflow-y-auto mb-8">
                        <div v-for="(c, i) in cart" :key="i" class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm">
                            <span class="font-bold">{{ c.名稱 }} x{{ c.qty }}</span>
                            <div class="flex items-center gap-4">
                                <span class="font-black">${{ c.售價 * c.qty }}</span>
                                <button @click="cart.splice(i, 1)" class="text-slate-300 hover:text-red-500">✕</button>
                            </div>
                        </div>
                        <div v-if="cart.length === 0" class="text-center py-12 text-slate-400 italic">尚未選擇商品</div>
                    </div>
                    <div class="text-4xl font-black text-right mb-8 text-indigo-900 border-t pt-5"><span class="text-base font-medium text-slate-400 mr-3">總額</span>${{ total }}</div>
                    <div class="grid grid-cols-2 gap-3">
                        <button v-for="m in ['現金','信用卡','LinePay','ApplePay']" @click="checkout(m)" class="bg-indigo-600 text-white hover:bg-indigo-800 py-4 rounded-2xl font-bold transition text-sm shadow-lg">結帳 ({{ m }})</button>
                    </div>
                </div>
            </div>

            <div v-if="view !== 'pos'" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 transition-all">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th v-for="h in headers" :key="h" class="p-5 text-xs font-black text-slate-400 uppercase tracking-widest">{{ h }}</th>
                                <th class="p-5 text-xs font-black text-slate-400 uppercase tracking-widest">管理</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr v-for="row in filteredData" :key="row[headers[0]]" class="hover:bg-indigo-50/40 transition">
                                <td v-for="h in headers" :key="h" class="p-5 text-sm font-semibold text-slate-600">{{ row[h] }}</td>
                                <td class="p-5 flex gap-4 text-sm font-bold">
                                    <button @click="editItem(row)" class="text-indigo-600 hover:underline">編輯</button>
                                    <button @click="deleteItem(row)" class="text-red-400 hover:underline">刪除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div v-if="showModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-in zoom-in duration-200">
                <div class="p-6 border-b bg-indigo-50/50 flex justify-between items-center">
                    <h3 class="text-xl font-black text-indigo-900">編輯資料</h3>
                    <button @click="showModal = false" class="text-slate-400 hover:text-indigo-900 text-2xl font-bold">✕</button>
                </div>
                <div class="p-8 space-y-5 max-h-[65vh] overflow-y-auto">
                    <div v-for="h in getDisplayHeaders()" :key="h">
                        <label class="block text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">{{ h }}</label>
                        
                        <select v-if="getCategoryOptions(h)" v-model="formData[h]" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition bg-slate-50 font-bold">
                            <option value="">請選擇{{ h }}</option>
                            <option v-for="opt in getCategoryOptions(h)" :key="opt" :value="opt">{{ opt }}</option>
                        </select>
                        
                        <input v-else v-model="formData[h]" type="text" :placeholder="'請輸入' + h" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition bg-slate-50 font-medium">
                        
                        <span v-if="isFieldRequired(h)" class="text-[10px] text-red-400 font-bold mt-1 inline-block">此為必填欄位</span>
                    </div>
                </div>
                <div class="p-8 border-t bg-slate-50 flex gap-4">
                    <button @click="showModal = false" class="flex-1 py-4 border-2 border-slate-200 rounded-2xl font-black text-slate-400 hover:bg-white transition">取消</button>
                    <button @click="saveData" :disabled="loading" class="flex-1 py-4 bg-indigo-700 text-white rounded-2xl font-black hover:bg-indigo-800 transition shadow-lg">確認儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbxhA0S9U1jFa2SxbFqOGBtbyTAvYj6jmDCM6SQuSyZlJ6DLLN3UP-VKQ3dKe0Lmk_d-_w/exec";

        createApp({
            data() {
                return {
                    isLoggedIn: false, loading: false, view: 'pos', searchQuery: '',
                    storeName: '', storeApi: '',
                    login: { user: '', pass: '' },
                    inventory: [], categories: [], members: [],
                    inventoryHeaders: [],
                    showModal: false, formData: {}, cart: []
                }
            },
            computed: {
                viewName() { return { pos: '收銀結帳', inventory: '商品庫存', category: '分類管理', member: '會員' }[this.view]; },
                headers() {
                    if (this.view === 'inventory') return this.inventoryHeaders;
                    if (this.view === 'category') return ['分類名稱','選項內容'];
                    if (this.view === 'member') return ['姓名','電話','生日','累積消費','累積點數','加入日期','備註'];
                    return [];
                },
                filteredData() {
                    let source = (this.view === 'pos' || this.view === 'inventory') ? this.inventory : (this.view === 'category' ? this.categories : this.members);
                    if (!source) return [];
                    if (!this.searchQuery) return source;
                    const q = this.searchQuery.toLowerCase();
                    return source.filter(i => Object.values(i).some(v => String(v).toLowerCase().includes(q)));
                },
                total() { return this.cart.reduce((s, i) => s + (i.售價 * i.qty), 0); }
            },
            methods: {
                // 決定彈窗顯示哪些欄位
                getDisplayHeaders() {
                    if (this.view === 'member') {
                        // 會員：隱藏「累積消費」與「加入日期」
                        return this.headers.filter(h => h !== '累積消費' && h !== '加入日期');
                    }
                    return this.headers;
                },
                // 判斷欄位是否必填
                isFieldRequired(h) {
                    if (this.view === 'member') return ['姓名','電話','生日'].includes(h);
                    return false;
                },
                // 獲取分類下拉選單的內容
                getCategoryOptions(header) {
                    const found = this.categories.find(c => c.分類名稱 === header);
                    return found ? found.選項內容.split(',') : null;
                },
                async handleLogin() {
                    if (!this.login.user || !this.login.pass) return;
                    this.loading = true;
                    try {
                        const res = await fetch(CENTRAL_API_URL, { method: 'POST', body: JSON.stringify({ username: this.login.user, password: this.login.pass }) });
                        const data = await res.json();
                        if (data.success) {
                            this.storeName = data.storeName;
                            this.storeApi = data.apiUrl;
                            await this.loadData();
                            this.isLoggedIn = true;
                        } else alert(data.msg);
                    } catch (e) { alert("連線錯誤"); }
                    this.loading = false;
                },
                async loadData() {
                    try {
                        const res = await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'getData' }) });
                        const data = await res.json();
                        this.inventory = data.inventory || [];
                        this.categories = data.categories || [];
                        this.members = data.members || [];
                        if (this.inventory.length > 0) this.inventoryHeaders = Object.keys(this.inventory[0]);
                        else {
                            const cats = this.categories.map(c => c.分類名稱);
                            this.inventoryHeaders = ["商品編號", ...cats, "名稱", "庫存", "成本", "售價"];
                        }
                    } catch (e) { console.error(e); }
                },
                openModal() { this.formData = {}; this.showModal = true; },
                editItem(item) { this.formData = { ...item }; this.showModal = true; },
                async saveData() {
                    // 必填欄位檢查
                    if (this.view === 'member') {
                        if (!this.formData['姓名'] || !this.formData['電話'] || !this.formData['生日']) {
                            alert("姓名、電話、生日為必填項目！");
                            return;
                        }
                        // 加入日期：如果是新會員才自動生成
                        if (!this.formData['加入日期']) {
                            this.formData['加入日期'] = new Date().toLocaleString();
                        }
                    }
                    
                    this.loading = true;
                    let action = this.view === 'inventory' ? 'saveProduct' : (this.view === 'category' ? 'saveCategory' : 'saveMember');
                    try {
                        await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action, data: this.formData }) });
                        await this.loadData();
                        this.showModal = false;
                    } catch (e) { alert("儲存失敗"); }
                    this.loading = false;
                },
                async deleteItem(row) {
                    if(!confirm("確定要刪除？")) return;
                    let s = this.view==='inventory'?'庫存表':(this.view==='category'?'分類管理':'會員表');
                    let k = this.view==='inventory'?'商品編號':(this.view==='category'?'分類名稱':'電話');
                    await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'deleteData', sheetName: s, idKey: k, idValue: row[k] }) });
                    await this.loadData();
                },
                addToCart(item) {
                    const ex = this.cart.find(c => c.商品編號 === item.商品編號);
                    if (ex) ex.qty++; else this.cart.push({ ...item, qty: 1 });
                },
                async checkout(method) {
                    if (!this.cart.length) return;
                    this.loading = true;
                    try {
                        for (let it of this.cart) {
                            const sale = { "時間": new Date().toLocaleString(), "商品編號": it.商品編號, "名稱": it.名稱, "數量": it.qty, "支付方式": method, "金額": it.售價 * it.qty, "折扣": 0, "利潤": (it.售價 - it.成本) * it.qty };
                            await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'addSale', data: sale }) });
                        }
                        this.cart = []; await this.loadData();
                        alert("結帳成功");
                    } catch (e) { alert("結帳連線失敗"); }
                    this.loading = false;
                },
                logout() { location.reload(); }
            }
        }).mount('#app');
    </script>
</body>
</html>
