<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優化版 POS 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>[v-cloak] { display: none; } .modal-bg { background: rgba(0,0,0,0.5); }</style>
</head>
<body class="bg-gray-50">
    <div id="app" v-cloak class="min-h-screen flex flex-col">
        <nav v-if="isLoggedIn" class="bg-indigo-700 text-white p-4 flex justify-between items-center shadow-md">
            <div class="font-bold tracking-tight">🏪 {{ storeName }}</div>
            <div class="flex gap-4 text-sm font-medium">
                <button @click="view = 'pos'" :class="view==='pos'?'text-yellow-300 underline':''">收銀</button>
                <button @click="view = 'inventory'" :class="view==='inventory'?'text-yellow-300 underline':''">庫存</button>
                <button @click="view = 'category'" :class="view==='category'?'text-yellow-300 underline':''">分類</button>
                <button @click="view = 'member'" :class="view==='member'?'text-yellow-300 underline':''">會員</button>
                <button @click="logout" class="bg-red-500 px-2 rounded">登出</button>
            </div>
        </nav>

        <div v-if="!isLoggedIn" class="flex-grow flex items-center justify-center">
            <div class="bg-white p-8 rounded-xl shadow-lg w-80">
                <h2 class="text-xl font-bold mb-4 text-center">POS 系統登入</h2>
                <input v-model="login.user" type="text" placeholder="帳號" class="w-full border p-2 mb-2 rounded">
                <input v-model="login.pass" type="password" placeholder="密碼" class="w-full border p-2 mb-4 rounded">
                <button @click="handleLogin" :disabled="loading" class="w-full bg-indigo-600 text-white py-2 rounded">登入</button>
            </div>
        </div>

        <main v-else class="p-4 max-w-6xl mx-auto w-full">
            <div v-if="view !== 'pos'" class="mb-4 flex justify-between">
                <input v-model="searchQuery" placeholder="搜尋..." class="border p-2 rounded w-64">
                <button @click="openModal" class="bg-green-600 text-white px-4 py-2 rounded">+ 新增{{viewName}}</button>
            </div>

            <div v-if="view === 'pos'" class="flex flex-col md:flex-row gap-4">
                <div class="grid grid-cols-2 gap-2 flex-grow">
                    <div v-for="i in filteredData" @click="addToCart(i)" class="bg-white p-4 border rounded shadow cursor-pointer hover:bg-indigo-50">
                        <div class="text-xs text-indigo-500">{{i.分類}}</div>
                        <div class="font-bold">{{i.名稱}}</div>
                        <div class="text-lg font-black">$ {{i.售價}}</div>
                    </div>
                </div>
                <div class="w-full md:w-64 bg-white p-4 border rounded shadow h-fit">
                    <h3 class="font-bold mb-2 border-b">購物車</h3>
                    <div v-for="(c,idx) in cart" class="text-sm mb-1 flex justify-between">
                        <span>{{c.名稱}} x{{c.qty}}</span>
                        <button @click="cart.splice(idx,1)" class="text-red-400">✕</button>
                    </div>
                    <div class="text-xl font-bold mt-4 border-t pt-2 text-right">總計: {{total}}</div>
                    <button @click="checkout('現金')" class="w-full bg-indigo-700 text-white mt-4 py-2 rounded">現金結帳</button>
                </div>
            </div>

            <div v-else class="bg-white rounded border overflow-x-auto shadow-sm">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th v-for="h in headers" class="p-3">{{h}}</th>
                            <th class="p-3">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="row in filteredData" class="border-b hover:bg-gray-50">
                            <td v-for="h in headers" class="p-3">{{row[h]}}</td>
                            <td class="p-3">
                                <button @click="editItem(row)" class="text-blue-600 mr-2">編輯</button>
                                <button @click="deleteItem(row)" class="text-red-500">刪除</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div v-if="showModal" class="fixed inset-0 modal-bg flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded-lg w-96 shadow-2xl">
                <h3 class="font-bold mb-4">編輯 {{viewName}}</h3>
                <div class="max-h-96 overflow-y-auto pr-2">
                    <div v-for="h in headers" class="mb-3">
                        <label class="block text-xs font-bold text-gray-500 mb-1">{{h}}</label>
                        <input v-model="formData[h]" class="w-full border p-2 rounded focus:ring-1 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div class="mt-6 flex gap-2">
                    <button @click="showModal = false" class="flex-1 bg-gray-100 py-2 rounded font-bold">取消</button>
                    <button @click="saveData" :disabled="loading" class="flex-1 bg-indigo-700 text-white py-2 rounded font-bold">{{loading?'處理中':'確認'}}</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbxhA0S9U1jFa2SxbFqOGBtbyTAvYj6jmDCM6SQuSyZlJ6DLLN3UP-VKQ3dKe0Lmk_d-_w/exec";

        createApp({
            data() {
                return {
                    isLoggedIn: false, loading: false, view: 'pos', searchQuery: '',
                    storeName: '', storeApi: '', login: { user: '', pass: '' },
                    inventory: [], categories: [], members: [], showModal: false, formData: {}, cart: []
                }
            },
            computed: {
                viewName() { return { pos: '收銀', inventory: '庫存', category: '分類', member: '會員' }[this.view]; },
                headers() {
                    if (this.view === 'inventory') return ['商品編號','名稱','分類','成本','售價','庫存', ...this.categories.map(c => c.分類名稱)];
                    if (this.view === 'category') return ['分類名稱','選項內容'];
                    if (this.view === 'member') return ['姓名','電話','生日','累積消費','累積點數','加入日期','備註'];
                    return [];
                },
                filteredData() {
                    let source = (this.view === 'pos' || this.view === 'inventory') ? this.inventory : (this.view === 'category' ? this.categories : this.members);
                    if (!this.searchQuery) return source;
                    const q = this.searchQuery.toLowerCase();
                    return source.filter(i => Object.values(i).some(v => String(v).toLowerCase().includes(q)));
                },
                total() { return this.cart.reduce((s, i) => s + (i.售價 * i.qty), 0); }
            },
            methods: {
                async handleLogin() {
                    this.loading = true;
                    try {
                        const res = await fetch(CENTRAL_API_URL, { method: 'POST', body: JSON.stringify({ username: this.login.user, password: this.login.pass }) });
                        const data = await res.json();
                        if (data.success) {
                            this.storeName = data.storeName; this.storeApi = data.apiUrl; this.isLoggedIn = true; await this.loadData();
                        } else alert(data.msg);
                    } catch (e) { alert("無法連線系統商"); }
                    this.loading = false;
                },
                async loadData() {
                    const res = await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'getData' }) });
                    const data = await res.json();
                    this.inventory = data.inventory; this.categories = data.categories; this.members = data.members;
                },
                openModal() { this.formData = {}; this.showModal = true; },
                editItem(item) { this.formData = { ...item }; this.showModal = true; },
                
                async saveData() {
                    this.loading = true;
                    // 正確的分支對應後端指令
                    let action = '';
                    if (this.view === 'inventory') action = 'saveProduct';
                    else if (this.view === 'category') action = 'saveCategory';
                    else if (this.view === 'member') action = 'saveMember';

                    try {
                        const res = await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action, data: this.formData }) });
                        const result = await res.json();
                        if (result.success) {
                            this.showModal = false;
                            await this.loadData(); // 成功後自動更新列表
                        } else alert(result.msg);
                    } catch (e) { alert("儲存失敗"); }
                    this.loading = false;
                },

                async deleteItem(row) {
                    if(!confirm("確定要刪除？")) return;
                    let idKey = '', idValue = '', sheetName = '';
                    if (this.view === 'inventory') { idKey = '商品編號'; idValue = row.商品編號; sheetName = '庫存表'; }
                    else if (this.view === 'category') { idKey = '分類名稱'; idValue = row.分類名稱; sheetName = '分類管理'; }
                    else if (this.view === 'member') { idKey = '電話'; idValue = row.電話; sheetName = '會員表'; }

                    await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'deleteData', sheetName, idKey, idValue }) });
                    await this.loadData();
                },
                addToCart(i) {
                    const ex = this.cart.find(c => c.商品編號 === i.商品編號);
                    if (ex) ex.qty++; else this.cart.push({ ...i, qty: 1 });
                },
                async checkout(m) {
                    this.loading = true;
                    for (let it of this.cart) {
                        const sale = { "時間": new Date().toLocaleString(), "商品編號": it.商品編號, "名稱": it.名稱, "數量": it.qty, "支付方式": m, "金額": it.售價 * it.qty, "折扣": 0, "利潤": (it.售價-it.成本)*it.qty };
                        await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'addSale', data: sale }) });
                    }
                    this.cart = []; await this.loadData(); this.loading = false; alert("結帳完成");
                },
                logout() { location.reload(); }
            }
        }).mount('#app');
    </script>
</body>
</html>
