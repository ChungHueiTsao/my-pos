<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端 POS 管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        .modal-bg { background-color: rgba(0,0,0,0.5); }
        .login-card { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">
    <div id="app" v-cloak class="min-h-screen flex flex-col">
        
        <nav v-if="isLoggedIn" class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
                <div class="font-black text-xl flex items-center">
                    <span class="mr-2">🏪</span> {{ storeName }}
                </div>
                <div class="hidden md:flex space-x-6 font-medium">
                    <button @click="view = 'pos'" :class="view === 'pos' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">結帳</button>
                    <button @click="view = 'inventory'" :class="view === 'inventory' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">庫存</button>
                    <button @click="view = 'category'" :class="view === 'category' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">分類</button>
                    <button @click="view = 'member'" :class="view === 'member' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">會員</button>
                </div>
                <button @click="logout" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition font-bold">登出</button>
            </div>
            <div class="md:hidden flex justify-around pb-2 text-xs border-t border-indigo-600 pt-2 bg-indigo-800">
                <button @click="view = 'pos'" :class="view === 'pos' ? 'text-yellow-300' : ''">結帳</button>
                <button @click="view = 'inventory'" :class="view === 'inventory' ? 'text-yellow-300' : ''">庫存</button>
                <button @click="view = 'category'" :class="view === 'category' ? 'text-yellow-300' : ''">分類</button>
                <button @click="view = 'member'" :class="view === 'member' ? 'text-yellow-300' : ''">會員</button>
            </div>
        </nav>

        <div v-if="!isLoggedIn" class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md login-card border-t-8 border-indigo-700">
                <h2 class="text-3xl font-black text-center text-indigo-800 mb-8 tracking-tighter">POS 系統登入</h2>
                <div class="space-y-4">
                    <input v-model="login.user" @keyup.enter="handleLogin" type="text" placeholder="帳號" class="w-full p-4 border-2 rounded-xl focus:border-indigo-500 outline-none transition bg-gray-50">
                    <input v-model="login.pass" @keyup.enter="handleLogin" type="password" placeholder="密碼" class="w-full p-4 border-2 rounded-xl focus:border-indigo-500 outline-none transition bg-gray-50">
                    <button @click="handleLogin" :disabled="loading" class="w-full bg-indigo-700 text-white p-4 rounded-xl font-bold text-lg hover:bg-indigo-800 transition disabled:opacity-50 shadow-lg flex items-center justify-center">
                        <svg v-if="loading" class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        {{ loading ? '登入中，請稍候...' : '確認登入' }}
                    </button>
                </div>
            </div>
        </div>

        <main v-else class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
            
            <div v-if="view !== 'pos'" class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="relative w-full md:max-w-xs">
                    <input v-model="searchQuery" type="text" :placeholder="'搜尋' + viewName + '...'" class="p-3 pl-10 border rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-400 outline-none transition bg-white">
                    <span class="absolute left-3 top-3 text-gray-400">🔍</span>
                </div>
                <button @click="openModal" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold shadow-md transition active:scale-95">
                    + 新增{{ viewName }}資料
                </button>
            </div>

            <div v-if="view === 'pos'" class="flex flex-col lg:flex-row gap-6">
                <div class="flex-grow grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto max-h-[75vh]">
                    <div v-for="item in filteredData" :key="item.商品編號" @click="addToCart(item)" class="bg-white p-4 rounded-2xl shadow hover:shadow-xl cursor-pointer transition border border-gray-100 group active:scale-95">
                        <div class="text-[10px] font-bold text-indigo-500 uppercase">貨號: {{ item.商品編號 }}</div>
                        <div class="font-bold text-gray-800 my-1 truncate group-hover:text-indigo-600">{{ item.名稱 }}</div>
                        <div class="text-xl font-black text-indigo-700">${{ item.售價 }}</div>
                        <div class="text-[10px] text-gray-400 mt-1">庫存: {{ item.庫存 }}</div>
                    </div>
                    <div v-if="inventory.length === 0" class="col-span-full py-20 text-center text-gray-400 italic">目前無商品，請先至庫存頁面新增。</div>
                </div>
                <div class="w-full lg:w-96 bg-white p-6 rounded-2xl shadow-xl h-fit border border-gray-100 sticky top-24">
                    <h3 class="text-xl font-black mb-4 border-b pb-2">🛒 待結清單</h3>
                    <div class="space-y-3 max-h-64 overflow-y-auto mb-6 pr-1">
                        <div v-if="cart.length === 0" class="text-center py-10 text-gray-400 text-sm italic">尚未選擇商品</div>
                        <div v-for="(c, i) in cart" :key="i" class="flex justify-between items-center p-3 bg-gray-50 rounded-xl">
                            <div class="text-sm font-bold">{{ c.名稱 }} x{{ c.qty }}</div>
                            <div class="flex items-center gap-3">
                                <span class="font-black text-indigo-700">${{ c.售價 * c.qty }}</span>
                                <button @click="cart.splice(i, 1)" class="text-red-400 hover:text-red-600 font-bold">✕</button>
                            </div>
                        </div>
                    </div>
                    <div class="text-3xl font-black text-right mb-6 text-indigo-900 border-t pt-4">
                        <span class="text-xs font-normal text-gray-400 mr-2 uppercase">Total</span>${{ total }}
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button v-for="m in ['現金','信用卡','LinePay','ApplePay']" @click="checkout(m)" class="bg-indigo-600 text-white hover:bg-indigo-800 py-3 rounded-xl font-bold transition text-xs shadow-md">
                            {{ m }}
                        </button>
                    </div>
                </div>
            </div>

            <div v-if="view !== 'pos'" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-indigo-50 border-b">
                            <tr>
                                <th v-for="h in headers" :key="h" class="p-4 text-xs font-black text-indigo-900 uppercase tracking-wider">{{ h }}</th>
                                <th class="p-4 text-xs font-black text-indigo-900 uppercase">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr v-if="filteredData.length === 0">
                                <td :colspan="headers.length + 1" class="p-10 text-center text-gray-400 italic">查無資料</td>
                            </tr>
                            <tr v-for="row in filteredData" :key="row[headers[0]]" class="hover:bg-indigo-50/50 transition">
                                <td v-for="h in headers" :key="h" class="p-4 text-sm font-medium text-gray-600">{{ row[h] }}</td>
                                <td class="p-4 flex gap-3 text-sm">
                                    <button @click="editItem(row)" class="text-indigo-600 font-bold hover:underline">編輯</button>
                                    <button @click="deleteItem(row)" class="text-red-400 font-bold hover:underline">刪除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div v-if="showModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
                <div class="p-6 border-b bg-indigo-50 flex justify-between items-center">
                    <h3 class="text-xl font-black text-indigo-800">編輯 {{ viewName }}</h3>
                    <button @click="showModal = false" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">✕</button>
                </div>
                <div class="p-6 space-y-4 max-h-[60vh] overflow-y-auto">
                    <div v-for="h in headers" :key="h">
                        <label class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-widest">{{ h }}</label>
                        <input v-model="formData[h]" type="text" class="w-full p-3 border-2 border-gray-100 rounded-xl focus:border-indigo-500 outline-none transition font-medium">
                    </div>
                </div>
                <div class="p-6 border-t bg-gray-50 flex gap-3">
                    <button @click="showModal = false" class="flex-1 py-4 border-2 rounded-xl font-bold text-gray-400 hover:bg-gray-100 transition">取消</button>
                    <button @click="saveData" :disabled="loading" class="flex-1 py-4 bg-indigo-700 text-white rounded-xl font-bold hover:bg-indigo-800 transition shadow-lg">
                        {{ loading ? '資料傳送中...' : '確認儲存' }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        // 已帶入您的 GAS 系統商網址
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbxhA0S9U1jFa2SxbFqOGBtbyTAvYj6jmDCM6SQuSyZlJ6DLLN3UP-VKQ3dKe0Lmk_d-_w/exec";

        createApp({
            data() {
                return {
                    isLoggedIn: false, loading: false, view: 'pos', searchQuery: '',
                    storeName: '', storeApi: '',
                    login: { user: '', pass: '' },
                    inventory: [], categories: [], members: [],
                    inventoryHeaders: [], // 庫存動態欄位
                    showModal: false, formData: {}, cart: []
                }
            },
            computed: {
                viewName() { return { pos: '結帳', inventory: '庫存', category: '分類', member: '會員' }[this.view]; },
                headers() {
                    // 根據目前分頁回傳標題
                    if (this.view === 'inventory') {
                        // 優先使用從 GAS 抓取的標題順序（分類插在中間）
                        return this.inventoryHeaders.length > 0 ? this.inventoryHeaders : ['商品編號','名稱','庫存','成本','售價'];
                    }
                    if (this.view === 'category') return ['分類名稱','選項內容'];
                    if (this.view === 'member') return ['姓名','電話','生日','累積消費','累積點數','加入日期','備註'];
                    return [];
                },
                filteredData() {
                    let source = (this.view === 'pos' || this.view === 'inventory') ? this.inventory : (this.view === 'category' ? this.categories : this.members);
                    if (!source) return [];
                    if (!this.searchQuery) return source;
                    const q = this.searchQuery.toLowerCase();
                    return source.filter(i => Object.values(i).some(v => String(v).toLowerCase().includes(q)));
                },
                total() { return this.cart.reduce((s, i) => s + (i.售價 * i.qty), 0); }
            },
            methods: {
                async handleLogin() {
                    if (!this.login.user || !this.login.pass) return;
                    this.loading = true;
                    try {
                        const res = await fetch(CENTRAL_API_URL, { method: 'POST', body: JSON.stringify({ username: this.login.user, password: this.login.pass }) });
                        const data = await res.json();
                        if (data.success) {
                            this.storeName = data.storeName;
                            this.storeApi = data.apiUrl;
                            await this.loadData();
                            this.isLoggedIn = true; // 資料載入成功後才顯示主介面
                        } else { alert(data.msg); }
                    } catch (e) { alert("連線異常"); }
                    this.loading = false;
                },
                async loadData() {
                    try {
                        const res = await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'getData' }) });
                        const data = await res.json();
                        this.inventory = data.inventory || [];
                        this.categories = data.categories || [];
                        this.members = data.members || [];
                        
                        // 處理庫存表「動態欄位排序」：讓分類插在商品編號與名稱之間
                        if (this.inventory.length > 0) {
                            // 獲取 GAS 傳回的第一筆物件 Key，這會遵循試算表的實體欄位順序
                            this.inventoryHeaders = Object.keys(this.inventory[0]);
                        } else {
                            // 若無資料，則根據分類管理頁面動態生成標題順序
                            const catNames = this.categories.map(c => c.分類名稱);
                            this.inventoryHeaders = ["商品編號", ...catNames, "名稱", "庫存", "成本", "售價"];
                        }
                    } catch (e) { console.error("資料載入異常", e); }
                },
                openModal() { this.formData = {}; this.showModal = true; },
                editItem(item) { this.formData = { ...item }; this.showModal = true; },
                async saveData() {
                    this.loading = true;
                    let action = this.view === 'inventory' ? 'saveProduct' : (this.view === 'category' ? 'saveCategory' : 'saveMember');
                    try {
                        await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action, data: this.formData }) });
                        await this.loadData(); // 儲存成功後重新同步資料與標題
                        this.showModal = false;
                    } catch (e) { alert("儲存失敗"); }
                    this.loading = false;
                },
                async deleteItem(row) {
                    if(!confirm("確定要刪除嗎？")) return;
                    let info = this.view === 'inventory' ? {k:'商品編號',v:row.商品編號,s:'庫存表'} : (this.view === 'category' ? {k:'分類名稱',v:row.分類名稱,s:'分類管理'} : {k:'電話',v:row.電話,s:'會員表'});
                    await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'deleteData', sheetName: info.s, idKey: info.k, idValue: info.v }) });
                    await this.loadData();
                },
                addToCart(item) {
                    const ex = this.cart.find(c => c.商品編號 === item.商品編號);
                    if (ex) ex.qty++; else this.cart.push({ ...item, qty: 1 });
                },
                async checkout(method) {
                    if (!this.cart.length) return;
                    this.loading = true;
                    try {
                        for (let it of this.cart) {
                            const sale = { "時間": new Date().toLocaleString(), "商品編號": it.商品編號, "名稱": it.名稱, "數量": it.qty, "支付方式": method, "金額": it.售價 * it.qty, "折扣": 0, "利潤": (it.售價 - it.成本) * it.qty };
                            await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'addSale', data: sale }) });
                        }
                        this.cart = []; await this.loadData();
                        alert("結帳完成");
                    } catch (e) { alert("結帳失敗"); }
                    this.loading = false;
                },
                logout() { location.reload(); }
            }
        }).mount('#app');
    </script>
</body>
</html>
