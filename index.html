<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階雲端 POS 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        .modal-bg { background-color: rgba(0,0,0,0.5); }
        /* 優化捲軸 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">
    <div id="app" v-cloak class="min-h-screen flex flex-col">
        <nav v-if="isLoggedIn" class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
                <div class="font-black text-xl tracking-tight">🏪 {{ storeName }}</div>
                <div class="hidden md:flex space-x-6 font-medium">
                    <button @click="view = 'pos'" :class="view === 'pos' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">收銀</button>
                    <button @click="view = 'inventory'" :class="view === 'inventory' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">庫存</button>
                    <button @click="view = 'category'" :class="view === 'category' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">分類管理</button>
                    <button @click="view = 'member'" :class="view === 'member' ? 'text-yellow-300 border-b-2 border-yellow-300' : ''" class="pb-1 transition">會員</button>
                </div>
                <button @click="logout" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition font-bold">登出</button>
            </div>
            <div class="md:hidden flex justify-around pb-2 text-xs border-t border-indigo-600 pt-2 bg-indigo-800">
                <button @click="view = 'pos'" :class="view === 'pos' ? 'text-yellow-300 font-bold' : ''">收銀</button>
                <button @click="view = 'inventory'" :class="view === 'inventory' ? 'text-yellow-300 font-bold' : ''">庫存</button>
                <button @click="view = 'category'" :class="view === 'category' ? 'text-yellow-300 font-bold' : ''">分類</button>
                <button @click="view = 'member'" :class="view === 'member' ? 'text-yellow-300 font-bold' : ''">會員</button>
            </div>
        </nav>

        <div v-if="!isLoggedIn" class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-indigo-700">
                <h2 class="text-3xl font-black text-center text-indigo-800 mb-8 tracking-tighter">POS 系統登入</h2>
                <div class="space-y-4">
                    <input v-model="login.user" @keyup.enter="handleLogin" type="text" placeholder="帳號" class="w-full p-4 border-2 rounded-xl focus:border-indigo-500 outline-none transition">
                    <input v-model="login.pass" @keyup.enter="handleLogin" type="password" placeholder="密碼" class="w-full p-4 border-2 rounded-xl focus:border-indigo-500 outline-none transition">
                    <button @click="handleLogin" :disabled="loading" class="w-full bg-indigo-700 text-white p-4 rounded-xl font-bold text-lg hover:bg-indigo-800 transition disabled:opacity-50 shadow-lg">
                        {{ loading ? '資料傳輸中...' : '確認登入' }}
                    </button>
                </div>
            </div>
        </div>

        <main v-else class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
            
            <div v-if="view !== 'pos'" class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 animate-fadeIn">
                <div class="relative w-full md:max-w-xs">
                    <input v-model="searchQuery" type="text" :placeholder="'搜尋' + viewName + '...'" class="p-3 pl-10 border rounded-xl w-full shadow-sm focus:ring-2 focus:ring-indigo-400 outline-none transition">
                    <span class="absolute left-3 top-3 text-gray-400">🔍</span>
                </div>
                <button @click="openModal" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold shadow-md transition active:scale-95">
                    + 新增{{ viewName }}資料
                </button>
            </div>

            <div v-if="view === 'pos'" class="flex flex-col lg:flex-row gap-6 animate-fadeIn">
                <div class="flex-grow grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto max-h-[75vh] p-1">
                    <div v-for="item in filteredData" :key="item.商品編號" @click="addToCart(item)" class="bg-white p-4 rounded-2xl shadow hover:shadow-xl cursor-pointer transition border border-gray-100 active:scale-95 group">
                        <div class="text-[10px] font-bold text-indigo-500 uppercase">{{ item.分類 }}</div>
                        <div class="font-bold text-gray-800 my-1 truncate group-hover:text-indigo-600">{{ item.名稱 }}</div>
                        <div class="text-xl font-black text-indigo-700">${{ item.售價 }}</div>
                        <div class="text-[10px] text-gray-400 mt-2">現庫存: {{ item.庫存 }}</div>
                    </div>
                </div>
                <div class="w-full lg:w-96 bg-white p-6 rounded-2xl shadow-xl h-fit border border-gray-100 sticky top-24">
                    <h3 class="text-xl font-black mb-4 flex items-center border-b pb-2"><span class="mr-2">🛒</span>待結帳清單</h3>
                    <div class="space-y-3 max-h-64 overflow-y-auto mb-6 pr-2">
                        <div v-if="cart.length === 0" class="text-center py-10 text-gray-400">尚未加入商品</div>
                        <div v-for="(c, i) in cart" class="flex justify-between items-center p-3 bg-indigo-50 rounded-xl">
                            <div>
                                <div class="text-sm font-bold">{{ c.名稱 }}</div>
                                <div class="text-xs text-gray-500">${{ c.售價 }} x {{ c.qty }}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-black text-indigo-700">${{ c.售價 * c.qty }}</span>
                                <button @click="cart.splice(i, 1)" class="text-red-400 hover:text-red-600 font-bold">✕</button>
                            </div>
                        </div>
                    </div>
                    <div class="text-3xl font-black text-right mb-6 text-gray-900 border-t pt-4">
                        <span class="text-sm font-normal text-gray-500 mr-2">總計</span>${{ total }}
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button v-for="m in ['現金','信用卡','LinePay','ApplePay']" @click="checkout(m)" class="bg-gray-800 text-white hover:bg-indigo-700 py-4 rounded-xl font-bold transition text-xs shadow-md">
                            {{ m }}
                        </button>
                    </div>
                </div>
            </div>

            <div v-if="view !== 'pos'" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 animate-fadeIn">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-indigo-50 border-b">
                            <tr>
                                <th v-for="h in headers" class="p-4 text-xs font-black text-indigo-900 uppercase tracking-wider">{{ h }}</th>
                                <th class="p-4 text-xs font-black text-indigo-900 uppercase">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <tr v-if="filteredData.length === 0">
                                <td :colspan="headers.length + 1" class="p-10 text-center text-gray-400">查無資料</td>
                            </tr>
                            <tr v-for="row in filteredData" class="hover:bg-indigo-50/50 transition duration-150">
                                <td v-for="h in headers" class="p-4 text-sm font-medium text-gray-600">{{ row[h] }}</td>
                                <td class="p-4 flex gap-3">
                                    <button @click="editItem(row)" class="text-indigo-600 font-bold hover:text-indigo-900">編輯</button>
                                    <button @click="deleteItem(row)" class="text-red-400 font-bold hover:text-red-600">刪除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <div v-if="showModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-in zoom-in duration-200">
                <div class="p-6 border-b bg-indigo-50 flex justify-between items-center">
                    <h3 class="text-xl font-black text-indigo-800">編輯{{ viewName }}資料</h3>
                    <button @click="showModal = false" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">✕</button>
                </div>
                <div class="p-6 space-y-4 max-h-[60vh] overflow-y-auto">
                    <div v-for="h in headers" :key="h">
                        <label class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-widest">{{ h }}</label>
                        <input v-model="formData[h]" type="text" class="w-full p-3 border-2 border-gray-100 rounded-xl focus:border-indigo-500 outline-none transition font-medium">
                        <p v-if="h === '選項內容'" class="text-[10px] text-gray-400 mt-1">※ 請用半形逗號隔開，如：紅,藍,綠</p>
                        <p v-if="h === '商品編號' || h === '電話' || h === '分類名稱'" class="text-[10px] text-indigo-400 mt-1">※ 此為唯一識別鍵，不可重複</p>
                    </div>
                </div>
                <div class="p-6 border-t bg-gray-50 flex gap-3">
                    <button @click="showModal = false" class="flex-1 py-4 border-2 rounded-xl font-bold text-gray-400 hover:bg-gray-100 transition">取消</button>
                    <button @click="saveData" :disabled="loading" class="flex-1 py-4 bg-indigo-700 text-white rounded-xl font-bold hover:bg-indigo-800 transition shadow-lg disabled:opacity-50">
                        {{ loading ? '傳送中...' : '確認儲存' }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        // 系統商 GAS 網址已固定帶入
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbxhA0S9U1jFa2SxbFqOGBtbyTAvYj6jmDCM6SQuSyZlJ6DLLN3UP-VKQ3dKe0Lmk_d-_w/exec";

        createApp({
            data() {
                return {
                    isLoggedIn: false, loading: false, view: 'pos', searchQuery: '',
                    storeName: '', storeApi: '',
                    login: { user: '', pass: '' },
                    inventory: [], categories: [], members: [],
                    showModal: false, formData: {}, cart: []
                }
            },
            computed: {
                viewName() { return { pos: '收銀', inventory: '庫存', category: '分類', member: '會員' }[this.view]; },
                headers() {
                    if (this.view === 'inventory') return ['商品編號','名稱','分類','成本','售價','庫存', ...this.categories.map(c => c.分類名稱)];
                    if (this.view === 'category') return ['分類名稱','選項內容'];
                    if (this.view === 'member') return ['姓名','電話','生日','累積消費','累積點數','加入日期','備註'];
                    return [];
                },
                filteredData() {
                    let source = [];
                    if (this.view === 'pos' || this.view === 'inventory') source = this.inventory;
                    else if (this.view === 'category') source = this.categories;
                    else if (this.view === 'member') source = this.members;
                    if (!this.searchQuery) return source;
                    const q = this.searchQuery.toLowerCase();
                    return source.filter(item => Object.values(item).some(val => String(val).toLowerCase().includes(q)));
                },
                total() { return this.cart.reduce((s, i) => s + (i.售價 * i.qty), 0); }
            },
            methods: {
                async handleLogin() {
                    if (!this.login.user || !this.login.pass) return alert("請輸入帳密");
                    this.loading = true;
                    try {
                        const res = await fetch(CENTRAL_API_URL, { method: 'POST', body: JSON.stringify({ username: this.login.user, password: this.login.pass }) });
                        const data = await res.json();
                        if (data.success) {
                            this.storeName = data.storeName; this.storeApi = data.apiUrl; this.isLoggedIn = true;
                            await this.loadData();
                        } else { alert(data.msg); }
                    } catch (e) { alert("系統商連線失敗，請檢查網路或 GAS 網址"); }
                    this.loading = false;
                },
                async loadData() {
                    try {
                        const res = await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'getData' }) });
                        const data = await res.json();
                        this.inventory = data.inventory || [];
                        this.categories = data.categories || [];
                        this.members = data.members || [];
                    } catch (e) { console.error("店家資料讀取失敗"); }
                },
                openModal() { this.formData = {}; this.showModal = true; },
                editItem(item) { this.formData = { ...item }; this.showModal = true; },
                
                // 核心優化：樂觀更新 (先更新畫面，再背景傳送)
                async saveData() {
                    const currentView = this.view;
                    const dataToSave = { ...this.formData };
                    this.showModal = false; // 立即關閉視窗，讓使用者覺得很快

                    // 1. 立即更新本地端畫面 (體感優化)
                    if (currentView === 'inventory') this.updateLocalArray(this.inventory, '商品編號', dataToSave);
                    else if (currentView === 'category') this.updateLocalArray(this.categories, '分類名稱', dataToSave);
                    else if (currentView === 'member') this.updateLocalArray(this.members, '電話', dataToSave);

                    // 2. 背景同步至 Google 試算表
                    let action = currentView === 'inventory' ? 'saveProduct' : (currentView === 'category' ? 'saveCategory' : 'saveMember');
                    
                    try {
                        const res = await fetch(this.storeApi, { 
                            method: 'POST', 
                            body: JSON.stringify({ action: action, data: dataToSave }) 
                        });
                        const result = await res.json();
                        if (!result.success) {
                            alert("後端同步失敗：" + result.msg);
                            this.loadData(); // 失敗時重新整理，校正資料
                        }
                    } catch (e) {
                        alert("網路中斷，請稍後檢查資料是否儲存成功。");
                        this.loadData();
                    }
                },
                
                updateLocalArray(list, idKey, newData) {
                    const idx = list.findIndex(item => String(item[idKey]) === String(newData[idKey]));
                    if (idx !== -1) {
                        list[idx] = newData; // 編輯舊有
                    } else {
                        list.unshift(newData); // 新增到最前面
                    }
                },

                async deleteItem(row) {
                    if(!confirm("確定要刪除這筆資料嗎？此動作不可撤銷。")) return;
                    
                    let info = {};
                    if (this.view === 'inventory') info = {k:'商品編號',v:row.商品編號,s:'庫存表',list:this.inventory};
                    else if (this.view === 'category') info = {k:'分類名稱',v:row.分類名稱,s:'分類管理',list:this.categories};
                    else if (this.view === 'member') info = {k:'電話',v:row.電話,s:'會員表',list:this.members};

                    // 樂觀更新：立即從畫面移除
                    const idx = info.list.findIndex(i => i[info.k] === info.v);
                    if (idx !== -1) info.list.splice(idx, 1);

                    try {
                        await fetch(this.storeApi, { 
                            method: 'POST', 
                            body: JSON.stringify({ action: 'deleteData', sheetName: info.s, idKey: info.k, idValue: info.v }) 
                        });
                    } catch (e) {
                        alert("刪除失敗，請檢查網路。");
                        this.loadData();
                    }
                },

                addToCart(item) {
                    if (item.庫存 <= 0) {
                        if (!confirm("此商品庫存不足，確定要繼續加入嗎？")) return;
                    }
                    const exist = this.cart.find(c => c.商品編號 === item.商品編號);
                    if (exist) exist.qty++;
                    else this.cart.push({ ...item, qty: 1 });
                },

                async checkout(method) {
                    if (this.cart.length === 0) return alert("購物車是空的");
                    this.loading = true;
                    try {
                        for (let item of this.cart) {
                            const saleData = {
                                "時間": new Date().toLocaleString(),
                                "商品編號": item.商品編號,
                                "名稱": item.名稱,
                                "數量": item.qty,
                                "支付方式": method,
                                "金額": item.售價 * item.qty,
                                "折扣": 0,
                                "利潤": (item.售價 - item.成本) * item.qty
                            };
                            await fetch(this.storeApi, { method: 'POST', body: JSON.stringify({ action: 'addSale', data: saleData }) });
                        }
                        alert("結帳成功！已更新庫存與紀錄。");
                        this.cart = [];
                        await this.loadData(); // 結帳後一定要校正一次庫存數據
                    } catch (e) { alert("結帳連線中斷，請確認試算表內容。"); }
                    this.loading = false;
                },
                logout() { if(confirm("確定登出？")) location.reload(); }
            }
        }).mount('#app');
    </script>
</body>
</html>
