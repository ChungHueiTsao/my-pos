<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS POS 雲端平台</title>
    <style>
        /* 樣式沿用前版，新增會員卡片樣式 */
        .member-info-bar { background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 10px; display: none; border-left: 5px solid #28a745; }
        .tab-bar { display: flex; overflow-x: auto; background: #fff; border-bottom: 1px solid #ddd; }
        .tab { flex: none; width: 100px; padding: 15px 0; text-align: center; cursor: pointer; }
        .tab.active { border-bottom: 3px solid #28a745; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中...</div></div>

<div class="container">
    <div id="loginPage" class="login-box"> ... </div>

    <div id="mainSystem" style="display:none;">
        <div class="tab-bar">
            <div class="tab active" id="posTab" onclick="showPage('pos')">結帳</div>
            <div class="tab" id="manageTab" onclick="showPage('manage')">庫存</div>
            <div class="tab" id="memberTab" onclick="showPage('member')">會員</div>
            <div class="tab" id="catTab" onclick="showPage('category')">分類</div>
            <div class="tab" onclick="location.reload()">登出</div>
        </div>

        <div id="posPage" class="page">
            <div style="margin: 10px 0;">
                <input type="text" id="posMemberSearch" placeholder="輸入手機搜尋會員..." oninput="searchMemberPos()">
                <div id="selectedMemberBar" class="member-info-bar"></div>
            </div>
            <input type="text" id="searchInput" placeholder="搜尋商品..." oninput="filterPosItems()">
            <div id="posSearchResults"></div>
        </div>

        <div id="memberPage" class="page" style="display:none;">
            <div id="addMemberSection" style="display:none; border: 1px solid #28a745; padding: 10px; margin-bottom: 10px;">
                <input type="text" id="m_custName" placeholder="姓名">
                <input type="text" id="m_custPhone" placeholder="手機號碼">
                <input type="date" id="m_custBirthday">
                <button onclick="saveMember()">儲存會員</button>
            </div>
            <input type="text" id="memberSearchKeyword" placeholder="搜尋會員姓名或手機..." oninput="filterMemberList()">
            <div id="memberListArea"></div>
        </div>
        
        </div>
</div>

<script>
    const CENTRAL_GAS = "您的中央管理GAS網址";
    let CURRENT_SHOP_GAS = "";
    let allItems = [], allMembers = [];
    let selectedMember = null;

    // --- 登入邏輯 (同前版) ---

    // --- 會員邏輯 ---
    async function loadMembers() {
        const res = await fetch(CURRENT_SHOP_GAS + "?type=members");
        allMembers = await res.json();
        filterMemberList();
    }

    function searchMemberPos() {
        const phone = document.getElementById('posMemberSearch').value;
        const member = allMembers.find(m => String(m["手機號碼"]) === phone);
        const bar = document.getElementById('selectedMemberBar');
        if (member) {
            selectedMember = member;
            bar.style.display = 'block';
            bar.innerHTML = `👤 會員：${member["姓名"]} | 剩餘點數：${member["剩餘點數"]}`;
        } else {
            selectedMember = null;
            bar.style.display = 'none';
        }
    }

    function filterMemberList() {
        const kw = document.getElementById('memberSearchKeyword').value.toLowerCase();
        const matches = allMembers.filter(m => m["姓名"].includes(kw) || String(m["手機號碼"]).includes(kw));
        document.getElementById('memberListArea').innerHTML = matches.map(m => `
            <div class="item-card">
                <div><strong>${m["姓名"]}</strong> (${m["手機號碼"]})<br>點數：${m["剩餘點數"]} | 消費：${m["累積消費"]}</div>
                <button onclick="editMember('${m["手機號碼"]}')" style="width:60px;">編輯</button>
            </div>
        `).join('');
    }

    async function saveMember() {
        const data = {
            "姓名": document.getElementById('m_custName').value,
            "手機號碼": document.getElementById('m_custPhone').value,
            "生日": document.getElementById('m_custBirthday').value
        };
        toggleLoading(true);
        await fetch(CURRENT_SHOP_GAS, { method: "POST", body: JSON.stringify({ action: "updateMember", memberData: data }) });
        await loadMembers();
        toggleLoading(false);
        document.getElementById('addMemberSection').style.display = 'none';
    }

    // 結帳時帶入會員資訊
    async function submitCheckout() {
        // ... 原有結帳邏輯 ...
        const payload = {
            action: "checkout",
            itemID: window.selectedItem["商品編號"],
            sellQty: qty,
            totalPrice: window.selectedItem["單價"] * qty,
            memberPhone: selectedMember ? selectedMember["手機號碼"] : null
        };
        await fetch(CURRENT_SHOP_GAS, { method: "POST", body: JSON.stringify(payload) });
        location.reload();
    }

    function showPage(page) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(page + 'Page').style.display = 'block';
        document.getElementById(page + 'Tab').classList.add('active');
        if (page === 'member') loadMembers();
    }
</script>
</body>
</html>
