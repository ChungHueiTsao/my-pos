<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端 POS 管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>[v-cloak] { display: none; } .modal-bg { background-color: rgba(0,0,0,0.5); }</style>
</head>
<body class="bg-gray-100 font-sans">
    <div id="app" v-cloak class="min-h-screen flex flex-col">
        <nav v-if="isLoggedIn" class="bg-indigo-700 text-white shadow-lg p-4 flex justify-between">
            <div class="font-bold">🏪 {{ storeName }}</div>
            <div class="space-x-4">
                <button @click="view = 'pos'">結帳</button>
                <button @click="view = 'inventory'">庫存</button>
                <button @click="view = 'member'">會員</button>
            </div>
            <button @click="logout" class="text-sm bg-red-500 px-2 py-1 rounded">登出</button>
        </nav>

        <main v-if="isLoggedIn" class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
            
            <div v-if="view === 'pos'" class="flex flex-col lg:flex-row gap-6">
                <div class="flex-grow">
                    <div class="mb-4 relative">
                        <input v-model="posSearch" type="text" placeholder="輸入商品編號或名稱搜尋..." class="w-full p-4 rounded-xl border-2 border-indigo-200 outline-none focus:border-indigo-500 shadow-sm">
                        <span class="absolute right-4 top-4">🔍</span>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto max-h-[70vh]">
                        <div v-for="item in filteredInventory" :key="item.商品編號" @click="addToCart(item)" class="bg-white p-4 rounded-2xl shadow hover:shadow-lg cursor-pointer transition border border-gray-100 active:scale-95">
                            <div class="text-[10px] font-bold text-indigo-500 uppercase">{{ item.商品編號 }}</div>
                            <div class="font-bold text-gray-800 my-1 truncate">{{ item.名稱 }}</div>
                            <div class="text-xl font-black text-indigo-700">${{ item.售價 }}</div>
                            <div class="text-[10px] text-gray-400">庫存: {{ item.庫存 }}</div>
                        </div>
                    </div>
                </div>

                <div class="w-full lg:w-[400px] bg-white p-6 rounded-2xl shadow-xl h-fit sticky top-6 border border-indigo-50">
                    <h3 class="text-xl font-black mb-4 border-b pb-2 flex items-center"><span class="mr-2">🛒</span>待結清單</h3>
                    
                    <div class="mb-4">
                        <label class="text-xs font-bold text-gray-500 uppercase">會員電話</label>
                        <input v-model="checkoutInfo.memberPhone" type="text" placeholder="請輸入電話..." class="w-full p-2 border rounded-lg bg-gray-50 mt-1">
                    </div>

                    <div class="space-y-3 max-h-60 overflow-y-auto mb-4 pr-1">
                        <div v-if="cart.length === 0" class="text-center py-10 text-gray-400 italic">尚未選擇商品</div>
                        <div v-for="(c, i) in cart" :key="i" class="flex flex-col p-3 bg-gray-50 rounded-xl">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-sm">{{ c.名稱 }}</span>
                                <button @click="cart.splice(i, 1)" class="text-red-400">✕</button>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="flex items-center border rounded-lg bg-white">
                                    <button @click="c.qty > 1 ? c.qty-- : null" class="px-2 py-1 text-indigo-600 font-bold">-</button>
                                    <span class="px-3 text-sm font-bold">{{ c.qty }}</span>
                                    <button @click="c.qty++" class="px-2 py-1 text-indigo-600 font-bold">+</button>
                                </div>
                                <span class="font-black text-indigo-700">${{ c.售價 * c.qty }}</span>
                            </div>
                        </div>
                    </div>

                    <div class="border-t pt-4 space-y-3">
                        <div class="flex items-center gap-2">
                            <select v-model="discountType" class="p-2 border rounded-lg text-sm bg-gray-50">
                                <option value="amount">折抵金額 ($)</option>
                                <option value="percent">折扣比例 (%)</option>
                            </select>
                            <input v-model.number="discountVal" type="number" class="flex-grow p-2 border rounded-lg text-right font-bold" placeholder="0">
                        </div>
                        <div class="flex justify-between text-gray-500 text-sm">
                            <span>小計</span><span>${{ subtotal }}</span>
                        </div>
                        <div class="flex justify-between text-red-500 text-sm">
                            <span>折扣</span><span>-${{ calculatedDiscount }}</span>
                        </div>
                        <div class="flex justify-between text-2xl font-black text-indigo-900 pt-2 border-t">
                            <span>應付金額</span><span>${{ finalTotal }}</span>
                        </div>
                    </div>

                    <div class="mt-6 space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <button v-for="m in ['現金','信用卡','LinePay','ApplePay']" 
                                    :key="m" 
                                    @click="checkoutInfo.method = m"
                                    :class="checkoutInfo.method === m ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'"
                                    class="py-2 rounded-lg font-bold transition text-xs border-2 border-transparent">
                                {{ m }}
                            </button>
                        </div>
                        <button @click="handleCheckout" :disabled="loading || cart.length === 0" class="w-full bg-green-600 text-white py-4 rounded-xl font-black text-xl hover:bg-green-700 transition shadow-lg disabled:opacity-50">
                            {{ loading ? '處理中...' : '確認結帳' }}
                        </button>
                    </div>
                </div>
            </div>

            <div v-else>...庫存與會員管理頁面...</div>
        </main>
    </div>

    <script>
        const { createApp } = Vue;
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbxhA0S9U1jFa2SxbFqOGBtbyTAvYj6jmDCM6SQuSyZlJ6DLLN3UP-VKQ3dKe0Lmk_d-_w/exec";

        createApp({
            data() {
                return {
                    isLoggedIn: false, loading: false, view: 'pos',
                    storeName: '', storeApi: '',
                    inventory: [], categories: [], members: [],
                    cart: [], posSearch: '',
                    discountType: 'amount', discountVal: 0,
                    checkoutInfo: { method: '現金', memberPhone: '' }
                }
            },
            computed: {
                filteredInventory() {
                    const q = this.posSearch.toLowerCase();
                    return this.inventory.filter(i => 
                        String(i.商品編號).toLowerCase().includes(q) || 
                        String(i.名稱).toLowerCase().includes(q)
                    );
                },
                subtotal() { return this.cart.reduce((s, i) => s + (i.售價 * i.qty), 0); },
                calculatedDiscount() {
                    if (this.discountType === 'amount') return this.discountVal;
                    return Math.round(this.subtotal * (this.discountVal / 100));
                },
                finalTotal() { return Math.max(0, this.subtotal - this.calculatedDiscount); }
            },
            methods: {
                addToCart(item) {
                    const ex = this.cart.find(c => c.商品編號 === item.商品編號);
                    if (ex) ex.qty++; else this.cart.push({ ...item, qty: 1 });
                },
                async handleCheckout() {
                    if (!this.cart.length) return;
                    this.loading = true;
                    
                    const orderId = 'ORD-' + Date.now(); // 產生訂單號
                    const checkoutTime = new Date().toLocaleString();
                    
                    // 根據折扣比例分攤每項商品的利潤
                    const discountRatio = this.finalTotal / this.subtotal;

                    const saleData = this.cart.map(it => {
                        const amount = it.售價 * it.qty;
                        const costTotal = it.成本 * it.qty;
                        // 利潤 = (此品項總額 * 整單折扣比) - 此品項總成本
                        const profit = Math.round((amount * discountRatio) - costTotal);
                        
                        return {
                            "時間": checkoutTime,
                            "訂單號": orderId,
                            "商品編號": it.商品編號,
                            "名稱": it.名稱,
                            "數量": it.qty,
                            "支付方式": this.checkoutInfo.method,
                            "金額": amount,
                            "折扣": Math.round(amount * (1 - discountRatio)),
                            "利潤": profit
                        };
                    });

                    try {
                        const res = await fetch(this.storeApi, { 
                            method: 'POST', 
                            body: JSON.stringify({ 
                                action: 'addSale', 
                                data: saleData,
                                memberPhone: this.checkoutInfo.memberPhone 
                            }) 
                        });
                        alert("結帳成功！訂單號：" + orderId);
                        this.cart = [];
                        this.discountVal = 0;
                        this.checkoutInfo.memberPhone = '';
                        await this.loadData();
                    } catch (e) {
                        alert("結帳連線失敗");
                    }
                    this.loading = false;
                },
                // ...其餘原本的 loadData, handleLogin, logout 函式...
            }
        }).mount('#app');
    </script>
</body>
</html>
