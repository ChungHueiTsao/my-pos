<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端 POS 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100">
    <div id="app">
        <nav class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="font-bold text-lg">🏪 {{ storeName || '雲端 POS' }}</h1>
            <div v-if="isLoggedIn" class="space-x-4 text-sm">
                <button @click="view = 'sales'">收銀</button>
                <button @click="view = 'inventory'">庫存</button>
                <button @click="logout" class="bg-red-500 px-2 py-1 rounded">登出</button>
            </div>
        </nav>

        <div v-if="!isLoggedIn" class="max-w-md mx-auto mt-20 p-6 bg-white rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-4">系統登入</h2>
            <input v-model="loginData.user" type="text" placeholder="帳號" class="w-full border p-2 mb-2">
            <input v-model="loginData.pass" type="password" placeholder="密碼" class="w-full border p-2 mb-4">
            <button @click="handleLogin" class="w-full bg-indigo-600 text-white py-2 rounded">進入系統</button>
        </div>

        <div v-else class="p-4">
            <div v-if="view === 'sales'" class="flex flex-col md:flex-row gap-4">
                <div class="flex-grow grid grid-cols-2 lg:grid-cols-4 gap-3">
                    <div v-for="item in inventory" :key="item.商品編號" 
                         @click="addToCart(item)"
                         class="bg-white p-3 rounded shadow cursor-pointer hover:border-indigo-500 border-2 border-transparent">
                        <div class="text-xs text-gray-500">{{ item.分類 }}</div>
                        <div class="font-bold">{{ item.名稱 }}</div>
                        <div class="text-indigo-600 font-bold">${{ item.售價 }}</div>
                    </div>
                </div>

                <div class="w-full md:w-80 bg-white p-4 rounded shadow">
                    <h3 class="font-bold border-b pb-2 mb-2">待結帳清單</h3>
                    <div v-for="c in cart" class="flex justify-between text-sm mb-1">
                        <span>{{ c.名稱 }} x {{ c.qty }}</span>
                        <span>${{ c.售價 * c.qty }}</span>
                    </div>
                    <hr class="my-2">
                    <div class="text-xl font-bold text-right mb-4">總計: ${{ totalAmount }}</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button v-for="pay in ['現金', '信用卡', 'LinePay']" 
                                @click="checkout(pay)"
                                class="bg-gray-100 py-2 rounded text-sm hover:bg-gray-200">
                            {{ pay }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        const CENTRAL_GAS_URL = "https://script.google.com/macros/s/AKfycbzzXeTLcSrdIq-fQP91WE-2rMKqNqp67ZKZLhLZhbo8zRsnM8pVxQCvner9e0T881h-Sw/exec";

        createApp({
            data() {
                return {
                    isLoggedIn: false,
                    view: 'sales',
                    storeName: '',
                    storeGasUrl: '',
                    loginData: { user: '', pass: '' },
                    inventory: [], // 從 GAS 撈取
                    cart: []
                }
            },
            methods: {
                async handleLogin() {
                    // 呼叫系統商 GAS 驗證
                    const res = await fetch(CENTRAL_GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ username: this.loginData.user, password: this.loginData.pass })
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.isLoggedIn = true;
                        this.storeName = data.storeName;
                        this.storeGasUrl = data.apiUrl;
                        this.loadStoreData();
                    } else { alert('登入失敗'); }
                },
                async loadStoreData() {
                    // 呼叫店家專屬 GAS 撈取資料
                    const res = await fetch(this.storeGasUrl, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'getData' })
                    });
                    const data = await res.json();
                    this.inventory = data.inventory;
                },
                addToCart(item) {
                    this.cart.push({ ...item, qty: 1 });
                },
                async checkout(method) {
                    // 結帳邏輯並傳送至 GAS...
                    alert('已使用 ' + method + ' 結帳完成！');
                    this.cart = [];
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
